<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Block Blast</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>Block Blast</h1>

    <div id="lobby">
      <input
        id="player-name"
        type="text"
        placeholder="Your name"
        maxlength="20"
      />
      <button id="solo-btn">Solo Play</button>
      <button id="new-room-btn">New Room</button>
      <input
        id="room-id-input"
        type="text"
        placeholder="Room ID"
        maxlength="20"
      />
      <button id="join-btn">Join Room</button>
    </div>
    <div id="share-link" style="display: none;">
      Share this link: <a id="share-url" href=""></a>
    </div>

    <div id="theme-picker">
      <label>Background <input type="color" id="bg-color" value="#111111" /></label>
      <label>Board <input type="color" id="board-color" value="#000000" /></label>
      <label>Grid lines <input type="color" id="grid-color" value="#2a2a2a" /></label>
    </div>

    <div id="status">Connecting to server...</div>

    <div id="score-display">Score: <span id="score">0</span></div>

    <div id="xp-display">XP: <span id="xp">0</span></div>

    <div id="game-area">
      <div id="game-left">
        <canvas id="board-canvas" class="board" width="480" height="480"></canvas>

        <div id="piece-selector">
          <div id="piece-selector-label">Available pieces:</div>
          <canvas id="piece-canvas" width="360" height="120"></canvas>
          <button id="skip-btn">Skip Turn (when no moves)</button>
          <button id="auto-play-btn" style="display:none;">Auto Play (Testing)</button>
        </div>
      </div>

      <div id="leaderboard-section">
        <h2>Leaderboard</h2>
        <table id="leaderboard-table">
          <thead>
            <tr><th>#</th><th>Player</th><th>XP</th><th>Best</th></tr>
          </thead>
          <tbody id="leaderboard-body"></tbody>
        </table>
      </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="game.js"></script>
    <script src="main.js"></script>
  </body>
</html>
